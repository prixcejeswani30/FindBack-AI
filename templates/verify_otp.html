{% extends "base.html" %}
{% block content %}
<div class="form-card narrow center">
  <div class="pill">ACCOUNT VERIFICATION</div>
  <h1>One last step.</h1>
  <p class="muted">Enter the 6-digit verification code to finish signing in.</p>
  <form method="post">
    <input class="otp" name="otp" maxlength="6" placeholder="123456" required>
    <button class="button full">Verify and continue</button>
  </form>
  <p class="demo-note">For this local build, use the verification code provided with your project setup.</p>
</div>
{% endblock %}
