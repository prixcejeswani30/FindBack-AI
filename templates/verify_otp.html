{% extends "base.html" %}
{% block content %}
<div class="form-card narrow center">
  <div class="pill">SECURITY CHECK</div>
  <h1>Verify OTP</h1>
  <p class="muted">Enter the 6-digit OTP sent to your phone.</p>
  <form method="post">
    <input class="otp" name="otp" maxlength="6" placeholder="123456" required>
    <button class="button full">Verify & Login</button>
  </form>
  <p class="demo-note">Hackathon demo OTP: <b>123456</b></p>
</div>
{% endblock %}
